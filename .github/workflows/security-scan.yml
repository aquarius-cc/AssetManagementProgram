name: Dependency Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 每周一凌晨 3:07 执行全量扫描（SC-8 落地）
    - cron: "7 3 * * 1"
  workflow_dispatch:

jobs:
  # ==================== 依赖变更探测 ====================
  # 【设计 2026-10-01，BF-067 §三-6 后续】audit 是重活（pip-audit 解析全依赖树 /
  # npm ci 全量安装），而 advisory DB 持续新增条目：axios 在 run 102 为绿、
  # run 103 因 DB 新增转红，同一 lockfile 零代码变更（DB 时序，非回归）。
  # 一旦 audit 成为合并门禁，任何新 advisory 都会把全部在开 PR 一并变红，
  # 开发者只能靠改无关 PR 的依赖来解。故 PR/push 仅在依赖文件变更时跑 audit，
  # schedule 每周全量兜底（SC-8），workflow_dispatch 供手动立即全量重扫。
  #
  # 【关键约束】必须用 job 级 if:，不可改触发级 paths:。触发级过滤会让整个
  # workflow 不运行 → check 永不出现 → 日后一旦列入 GitHub required checks，
  # PR 将永久挂起（GitHub 不把「未上报」视为通过）。job 级 if: 下 workflow
  # 每次都运行，Security 汇总必定上报结论。
  changes:
    name: "依赖变更探测"
    runs-on: ubuntu-latest
    outputs:
      deps-changed: ${{ steps.detect.outputs.deps-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # base.sha 须可达（PR 默认浅克隆只有 merge commit）
          submodules: false     # 仅比对路径，无需子模块内容
      - name: 比对依赖文件
        id: detect
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # schedule / workflow_dispatch 无 before；仓库首个推送的 before 亦为全 0
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            echo "无可比对基线 → 按全量审计处理"
            echo "deps-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 【fail-closed 修正 2026-10-01】原写法把 git diff 与 grep 串成管道直接当
          # if 条件，靠 pipefail 传播错误。但 git diff 自身报错时（force-push 致
          # base sha 不可达 / 浅克隆未取到该 commit / 仓库损坏），整条管道失败 →
          # 落入 else → deps-changed=false → 审计被静默跳过而汇总仍报 success，
          # 等于给门禁开了 fail-open 后门。改为把 git 的退出码与 grep 的匹配
          # 结果彻底分开：git 失败即按全量审计处理。
          #
          # Dockerfile 入选依据：它 FROM python:3.12.8-slim-bookworm 钉了基础镜像
          # tag，改动会改变镜像内依赖集合（实测它只装 base.txt、不装 dev.txt）
          if ! DIFF_OUT="$(git diff --name-only "$BASE" "$GITHUB_SHA")"; then
            echo "⚠️ 无法比对基线（git 失败）→ 按全量审计处理（fail-closed）"
            echo "deps-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$DIFF_OUT" | grep -qE \
            '^(asset_management_backend/requirements/|asset_management_backend/(pyproject\.toml|Dockerfile)|vue-assetmanagement/package(-lock)?\.json$|\.github/workflows/security-scan\.yml$)'; then
            echo "依赖文件有变更 → 需审计"
            echo "deps-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "依赖文件无变更 → 跳过 audit（schedule 仍全量）"
            echo "deps-changed=false" >> "$GITHUB_OUTPUT"
          fi

  python-audit:
    name: "Python 依赖安全审计 (pip-audit)"
    needs: [changes]
    if: needs.changes.outputs.deps-changed == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asset_management_backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 pip-audit
        run: pip install pip-audit
      - name: 执行安全审计（生产 + 开发依赖）
        # 【修正 2026-09-30】两处缺陷：
        # ① 审计对象错位：原实现先生成 `pip freeze > requirements-snapshot.txt`，
        #    但本 job 从未执行 `pip install -r requirements/...`，快照里只有
        #    pip-audit 自身的依赖，项目包一个都没装 → 等于审空气。
        #    改为直接审计仓库声明的 requirements 文件（pip-audit 会自行解析传递依赖）。
        # ② 参数不存在：`--fail-on=high` 在 pip-audit 2.x 中无此选项，argparse 直接
        #    以 exit 2 失败（2026-09-30 实测，usage 列表中无任何 severity 门禁开关）。
        #    pip-audit 的默认行为即「发现任意漏洞即 exit 1」，故不再传该参数。
        run: |
          pip-audit --requirement requirements/base.txt
          pip-audit --requirement requirements/dev.txt
      - name: 生成安全报告
        if: always()
        run: |
          pip-audit --requirement requirements/base.txt --format json --output audit-report.json || true
          pip-audit --requirement requirements/dev.txt --format json --output audit-report-dev.json || true
      - name: 上传安全报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-audit-report
          # 注：uses 步骤的 path 相对 GITHUB_WORKSPACE 解析，不受 defaults.run.working-directory 影响
          # （与 ci.yml 的 backend-coverage-report / frontend-coverage-report 同构写法）
          path: |
            asset_management_backend/audit-report.json
            asset_management_backend/audit-report-dev.json

  node-audit:
    name: "Node.js 依赖安全审计 (npm audit)"
    needs: [changes]
    if: needs.changes.outputs.deps-changed == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue-assetmanagement
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vue-assetmanagement/package-lock.json
      - run: npm ci
      - name: 执行安全审计（高危阻断）
        run: npm audit --audit-level=high
      - name: 生成安全报告
        if: always()
        run: npm audit --json > audit-report.json || true
      - name: 上传安全报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-audit-report
          path: vue-assetmanagement/audit-report.json

  # ==================== 密钥扫描 (SC-2 落地) ====================
  secret-scan:
    name: "密钥泄露扫描"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: 检查硬编码密钥（AK/SK/Token/密码）
        run: |
          echo "=== 扫描疑似硬编码密钥 ==="
          # 扫描常见的密钥模式
          PATTERNS=(
            'AKIA[0-9A-Z]{16}'
            '-----BEGIN.*PRIVATE KEY-----'
            'password\s*[:=]\s*["\x27][^"\x27]{8,}'
            'secret\s*[:=]\s*["\x27][^"\x27]{8,}'
            'token\s*[:=]\s*["\x27][^"\x27]{8,}'
            'api_key\s*[:=]\s*["\x27][^"\x27]{8,}'
          )
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(rg -n "$pattern" --type py --type js --type ts --type json -g '!node_modules' -g '!*.lock' -g '!venv/' -g '!dist/' . 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️ 发现疑似密钥匹配: $pattern"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "❌ 检测到疑似硬编码密钥，请人工确认并移除"
            echo "   若为误报，请在 PR 描述中说明"
            exit 1
          fi
          echo "✅ 未发现硬编码密钥"

      - name: 扫描文档与环境文件中的 env 式裸赋值密钥（2026-08 泄露事故补丁）
        run: |
          echo "=== 扫描 md/yml/env/txt 中的裸赋值密钥 ==="
          # 背景: 真实密码曾经 docs 审查报告进入 git 历史，原扫描器不覆盖 markdown 且引号模式漏检 env 裸赋值
          # 【修正 2026-09-30】原正则整串用单引号包裹，但字符类 ["']? 内含裸单引号 '，
          # bash 在单引号串内遇到 ' 即终止字符串，剩余部分被当作命令解析 →
          # "unexpected EOF while looking for matching '"  (exit 2)。
          # 改用 \x22 / \x27 表示双引号与单引号，语义完全等价，且不与外层引号冲突。
          # 已用 rg 15.1.0 实测：目标形态可命中，仓库内 git 跟踪文件零误报。
          MATCHES=$(rg -n '^[\s\-*>#]{0,8}[A-Za-z_]*(PASSWORD|SECRET|TOKEN|API_KEY)[A-Za-z_]*\s*[=:]\s*[\x22\x27]?[A-Za-z0-9@#*_\-+/]{8,}[\x22\x27]?\s*$' \
            -g '!node_modules' -g '!*.lock' -g '!venv/' -g '!dist/' -g '!*.svg' \
            -g '!.github/**' -g '!.git/**' \
            -g '*.md' -g '*.yml' -g '*.yaml' -g '*.env' -g '*.txt' -g '*.sh' . 2>/dev/null \
            | rg -v -i 'changeme|change-me|your[-_]?(password|secret|key)|example|placeholder|请替换|占位|x{5,}|\*{3,}' || true)
          if [ -n "$MATCHES" ]; then
            echo "⚠️ 发现文档/环境文件中的裸赋值疑似密钥:"
            echo "$MATCHES"
            echo "❌ 请脱敏后重新提交；若为误报请在 PR 描述中说明"
            exit 1
          fi
          echo "✅ 文档与环境文件未发现裸赋值密钥"

      - name: 已轮换泄露凭据残留检查（黑名单）
        run: |
          echo "=== 检查历史事故凭据是否回流 ==="
          # 2026-08-26 事故轮换的凭据指纹，禁止再次出现在仓库任何位置
          BLACKLIST=(
            'PostgresTerminal@8348'
            'dev_asset_mgmt_xk9f'
            'prod_asset_mgmt_r7t4'
          )
          FOUND=0
          for item in "${BLACKLIST[@]}"; do
            MATCHES=$(rg -n -F "$item" -g '!node_modules' -g '!dist/' -g '!.github/**' -g '!.git/**' . 2>/dev/null | rg -v '已脱敏|已轮换失效' || true)
            if [ -n "$MATCHES" ]; then
              echo "❌ 发现已轮换泄露凭据指纹回流: $item"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "✅ 无历史泄露凭据回流"

  # ==================== 周报生成 (SC-8 落地) ====================
  weekly-report:
    name: "每周安全报告"
    runs-on: ubuntu-latest
    needs: [python-audit, node-audit]
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: 汇总本周安全发现
        run: |
          echo "# 每周安全审计报告" > security-weekly-report.md
          echo "" >> security-weekly-report.md
          echo "**生成时间**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> security-weekly-report.md
          echo "" >> security-weekly-report.md
          echo "## Python 依赖" >> security-weekly-report.md
          echo "- 审计状态: ${{ needs.python-audit.result }}" >> security-weekly-report.md
          echo "" >> security-weekly-report.md
          echo "## Node.js 依赖" >> security-weekly-report.md
          echo "- 审计状态: ${{ needs.node-audit.result }}" >> security-weekly-report.md
      - name: 上传周报
        uses: actions/upload-artifact@v4
        with:
          name: security-weekly-report
          path: security-weekly-report.md

  # ==================== 安全门禁汇总 ====================
  # 【设计 2026-10-01，BF-067 §三-6 后续】与 ci.yml 的「CI 汇总」同构：把
  # security-scan 的结论收敛为单一 check，供 GitHub required checks 引用，
  # 并在 ci-cd.yml 作为部署前置门禁。
  #
  # 【易错点，不能写成无条件的 result != success → exit 1】audit 被有意跳过时
  # result 为 skipped，那样会在依赖未变更时误红。必须先用 deps-changed 分流：
  # 需要审计时要求 audit 成功，不需审计时放行，但 secret-scan 任何情况下都必须
  # 成功（新增密钥与依赖变更无关，故 secret-scan 不加 needs/if，每次都跑）。
  security-summary:
    name: "Security 汇总"
    runs-on: ubuntu-latest
    needs: [changes, python-audit, node-audit, secret-scan]
    if: always()
    steps:
      - name: 汇总安全门禁结果
        run: |
          echo "=== Security Scan Results ==="
          echo "依赖变更探测:     ${{ needs.changes.outputs.deps-changed }}"
          echo "Python 依赖审计:  ${{ needs.python-audit.result }}"
          echo "Node 依赖审计:    ${{ needs.node-audit.result }}"
          echo "密钥泄露扫描:     ${{ needs.secret-scan.result }}"
          echo ""
          if [ "${{ needs.changes.outputs.deps-changed }}" = "true" ] || \
             [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ needs.python-audit.result }}" != "success" ] || \
               [ "${{ needs.node-audit.result }}" != "success" ]; then
              echo "❌ 依赖安全审计未通过，阻止合并"
              exit 1
            fi
            echo "✅ 依赖安全审计通过"
          else
            echo "ℹ️ 依赖文件未变更，本次跳过依赖审计（schedule 每周全量兜底）"
          fi
          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "❌ 密钥泄露扫描未通过，阻止合并"
            exit 1
          fi
          echo "✅ 密钥泄露扫描通过"
          echo "✅ 安全门禁通过"
