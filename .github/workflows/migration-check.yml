# =============================================================================
# Migration Safety Check (CT-6) —— M-01 v3.1 唤醒版（BF-183 批次 1，3b）
# =============================================================================
# 【M-01 v3.1，2026-11-08】原 on: pull_request only + 触发级 paths 过滤 →
# 本仓直推模式（历史 0 PR）下本 workflow 从未被触发，CT-6 迁移红线从未进
# 部署链回查面（M-01 根因：gate 单名单只回查安全扫描）。唤醒改造：
#   1. on 增 push（master）、删触发级 paths——子模块指针变更永不命中 paths，
#      过滤会把触发面再收窄到空（PR 面保留，零成本）；
#   2. fetch-depth: 0 + submodule-fetch-depth: 0——gitlink 指针 diff 需要
#      两端旧指针本地可解析（浅克隆则只能降级全扫或 fail-closed）；
#   3. ③④ 由「backend 子模块 WD 内 origin/base_ref...HEAD」（push 下
#      base_ref 空 → || true → 空列表 → exit 0 静默放行 = fail-open）改为
#      根仓「变更面解析」step 单源（③④ 共用）：push → 父提交为 BASE；
#      PR → base 分支；BASE 空/全零 → 全量扫描（S-2 边界：fail_closed
#      仅留给运行中真实 git 故障，本步 set -e 下真实故障即红）；
#      子模块 gitlink 指针 diff（复刻 security-scan B 分支）：迁移文件在
#      backend 子模块内，根仓 diff 只能看到指针变更 → 两端解析 backend
#      gitlink，子模块内做文件级 diff；
#   4. 步骤① makemigrations --dry-run 全量跑，不受变更集合短路（O-1：
#      计入 gate 600s 轮询预算——3b 是 3c 的硬前置，否则 gate 必超时拒部署）。
name: Migration Safety Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  migration-safety:
    name: "迁移文件安全验证 (CT-6)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asset_management_backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-dummy-not-real
          POSTGRES_DB: asset_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: asset_management_test
      DB_USER: postgres
      DB_PASSWORD: ci-dummy-not-real
    steps:
      # 【M-01 v3.1】fetch-depth: 0 + submodule-fetch-depth: 0：gitlink 指针 diff
      # 需本地解析两端旧指针（见头部注释 2）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          submodule-fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt

      - name: "步骤① 确认无遗漏迁移"
        run: |
          echo "=== 检查是否有未生成的迁移 ==="
          OUTPUT=$(python manage.py makemigrations --dry-run 2>&1)
          if echo "$OUTPUT" | grep -q "No changes detected"; then
            echo "✅ 无遗漏迁移"
          else
            echo "❌ 检测到未生成的迁移:"
            echo "$OUTPUT"
            echo ""
            echo "请先执行 python manage.py makemigrations 生成迁移文件"
            exit 1
          fi

      - name: "步骤② 预览待执行迁移列表"
        run: |
          echo "=== 待执行迁移列表 ==="
          python manage.py migrate --plan

      # 【M-01 v3.1】变更面解析（③④ 共用单源，根仓执行——覆盖 job 级
      # working-directory）。BASE 解析（S-2 边界）：push → 父提交；PR → base 分支；
      # BASE 空/全零（首提交/浅）→ 全量扫描，绝不静默放行。
      - name: "变更面解析（③④ 共用，M-01 v3.1）"
        working-directory: .
        env:
          # 【注入防护】事件上下文值经 env 传入再以 $VAR 引用，禁止 ${{ }} 直接
          # 插进 run（同 ci-cd.yml 口径：base_ref 可被 fork PR 控制）。
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF" --depth=1
            BASE="origin/$BASE_REF"
          else
            BASE=$(git rev-parse --verify -q "$HEAD_SHA^" || true)
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            # S-2 边界：BASE 空/全零 → 全量扫描（fail-closed 方向：多扫不漏扫）
            echo "ℹ️ BASE 不可用（首提交或浅克隆），降级为全量扫描全部迁移文件"
            MIGRATION_FILES=$(cd asset_management_backend && git ls-files -r -- "*/migrations/*.py")
          else
            MIGRATION_FILES=$(git diff --name-only "$BASE" "$HEAD_SHA" -- "*/migrations/*.py")
            # 子模块 gitlink 指针 diff（复刻 security-scan B 分支）：迁移文件在
            # backend 子模块内，根仓 diff 只见指针变更 → 两端解析 gitlink，
            # 子模块内做文件级 diff（旧指针对象由 submodule-fetch-depth: 0 保证在场）。
            OLD_BE=$(git rev-parse -q --verify "$BASE:asset_management_backend" || true)
            NEW_BE=$(git rev-parse -q --verify "$HEAD_SHA:asset_management_backend" || true)
            if [ -n "$OLD_BE" ] && [ -n "$NEW_BE" ] && [ "$OLD_BE" != "$NEW_BE" ]; then
              echo "ℹ️ backend 子模块指针变更: ${OLD_BE:0:7} → ${NEW_BE:0:7}"
              SUB_FILES=$(cd asset_management_backend && git diff --name-only "$OLD_BE" "$NEW_BE" -- "*/migrations/*.py")
              MIGRATION_FILES=$(printf '%s\n%s' "$MIGRATION_FILES" "$SUB_FILES" | sed '/^$/d')
            fi
          fi
          if [ -z "$MIGRATION_FILES" ]; then
            echo "✅ 无迁移文件变更（本面）"
          else
            echo "变更迁移文件："
            echo "$MIGRATION_FILES"
          fi
          # GITHUB_ENV 写入（BF-183 首跑 42432138344 修复）：heredoc 形式兼容多行值
          #（裸 printf '%s' 在 ≥2 文件时会写错 GITHUB_ENV 解析，文件静默丢失 = fail-open）；
          # 空值也必须定义变量（裸 printf '%s' "" 写零字节，③/④ set -u 直接 unbound）。
          {
            echo "MIGRATION_FILES<<MIG_DELIM"
            if [ -n "$MIGRATION_FILES" ]; then
              printf '%s\n' "$MIGRATION_FILES"
            fi
            echo "MIG_DELIM"
          } >> "$GITHUB_ENV"

      - name: "步骤③ 检查危险操作"
        working-directory: .
        run: |
          set -euo pipefail
          echo "=== 扫描变更迁移文件中的危险操作 ==="
          # set -u 安全读（BF-183 首跑 42432138344）：变量未定义（如 GITHUB_ENV
          # 空值边缘）时按空面处理，不得 unbound 判红。
          MIG_FILES="${MIGRATION_FILES-}"
          if [ -z "$MIG_FILES" ]; then
            echo "✅ 未发现迁移文件变更"
            exit 0
          fi
          FOUND_DANGER=0
          for file in $MIG_FILES; do
            # 子模块内 diff 出的路径相对 backend；根仓 diff 出的路径已含前缀
            case "$file" in
              asset_management_backend/*) real="$file" ;;
              *) real="asset_management_backend/$file" ;;
            esac
            if [ -f "$real" ]; then
              echo "检查: $real"
              if grep -n "RemoveIndex\|RemoveField\|RenameField\|RenameModel" "$real"; then
                echo "⚠️ 文件 $real 包含危险操作（Remove/Rename）"
                FOUND_DANGER=1
              fi
            fi
          done
          if [ "$FOUND_DANGER" -eq 1 ]; then
            echo ""
            echo "⚠️ 检测到危险迁移操作，请确认："
            echo "  1. 已在 push/PR 描述中注明'已人工确认数据无损'"
            echo "  2. 已重点审查"
            echo "  3. 已备份数据库"
            # 不直接阻止，但发出警告（由 Code Review 人工把关）
          else
            echo "✅ 未发现危险迁移操作"
          fi

      - name: "步骤④ 不可逆数据迁移硬门禁 (BF-005)"
        working-directory: .
        run: |
          set -euo pipefail
          MIG_FILES="${MIGRATION_FILES-}"
          if [ -z "$MIG_FILES" ]; then
            echo "✅ 未发现迁移文件变更"
            exit 0
          fi
          FOUND_NOOP=0
          for file in $MIG_FILES; do
            case "$file" in
              asset_management_backend/*) real="$file" ;;
              *) real="asset_management_backend/$file" ;;
            esac
            [ -f "$real" ] || continue
            if grep -q "RunPython.noop" "$real" && ! grep -q "ROLLBACK_NOOP_REASON:" "$real"; then
              echo "❌ $real 含不可逆数据迁移(RunPython.noop 反向)但未标注 ROLLBACK_NOOP_REASON"
              FOUND_NOOP=1
            fi
          done
          if [ "$FOUND_NOOP" = 1 ]; then
            echo ""
            echo "修复方式：在 RunPython.noop 所在文件内添加注释标记："
            echo "  # ROLLBACK_NOOP_REASON: <为何反向为 noop 的业务理由>"
            exit 1
          fi
          echo "✅ 变更迁移的不可逆点均已登记理由"
