# =============================================================================
# GitHub Actions CI/CD - 持续部署部分 (BF-005: 自子目录迁移至仓库根)
# =============================================================================
# 背景: 原文件位于 asset_management_backend/.github/workflows/, GitHub Actions
# 只识别仓库根 .github/workflows/, 该流水线从未被执行过(审计 BF-005 疏漏1)。
#
# 职责划分(与根 ci.yml 去重):
#   - 本文件       = CD(docker build/push + 镜像保留策略), 仅在 CI 汇总与安全扫描
#                    双双通过后（CI 触发 + 扫描回查，M-02 真闭合）
#   - ci.yml       = CI(lint/test/coverage/变异/护栏)
#   - security-scan.yml = 依赖漏洞审计 + 密钥扫描
#
# 【触发改造 2026-10-01，BF-067 §三-6 后续】原为 push[master] + workflow_dispatch。
# 现改为仅 workflow_run（监听 Dependency Security Scan 完成）：
#   ① 部署不再与审计并行竞争，安全扫描不通过则镜像不推送；
#   ② 移除 workflow_dispatch —— 该触发下 github.event.workflow_run 上下文为空，
#      security-gate 必然失败，留着会制造永久红的误导性入口。代价是无法手动
#      重跑部署，只能推空提交触发。
#
# 【M-02 真闭合，2026-10-31】触发源由 "Dependency Security Scan" 改为 "CI Pipeline"：
# CI 含全量测试与变异（分钟级到小时级），安全扫描仅依赖审计（分钟级）。
# 让长的一方触发、短的一方回查，可零成本获得「CI 绿才部署」（conclusion 由事件直接给出），
# 安全扫描结论则用 actions: read 按 SHA 回查 + 短 poll 兜底（fail-closed）。
# 反之（原链）在 gate 内等 CI 完成需轮询 1 小时级，属不可接受的 runner 成本。
# 附带收益：schedule 触发的安全扫描（每周一全量）原会触发本 workflow 并在
# event 校验处必红一个 run；CI Pipeline 无 schedule 触发，该噪声消失。
# 【静默停摆防护】监听名与 ci.yml name 的一致性由 scripts/check_ci_orchestration.py 断言
# （backend-lint 护栏自测步骤执行），CI 改名漏改本文件会立即红而非 CD 无声中断。
#
# 【仓库迁移 2026-10-13】镜像仓库由 Docker Hub 改为 GHCR(github.com/packages)：
#   触发事实: Docker Hub 网络不可达; 迁移后零库外 secrets(GITHUB_TOKEN 即可发布),
#   原 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN 前置要求整项作废(审计 GHCR 迁移决策)。
# Variables:
#   - PROD_IMAGE_SHA: deploy 成功后由部署方写入, prune 时排除以防回滚无镜像可用
# =============================================================================

name: CD Pipeline

on:
  workflow_run:
    # 【M-02 真闭合，2026-10-31】改监听 CI Pipeline（长链触发、短链回查，理由见头部注释）。
    workflows: ["CI Pipeline"]
    types: [completed]

# 【权限调整 2026-10-13，GHCR 迁移】原收窄为 contents:read(不依赖 GITHUB_TOKEN
# 写能力)的依据是"外写走 Docker Hub secrets"; 迁移后唯一外写 = 向本仓 namespace
# 发布/清理 GHCR 镜像, 故增 packages: write。token 一次性、随 run 注入且仓库限定,
# 取代原库外长期 Docker Hub PAT(Read & Delete) —— 净安全收益为正。仍不授予
# contents: 写能力, security-gate 爆炸半径兜底不变。
# 【M-02 真闭合，2026-10-31】增 actions: read —— 按 SHA 回查 Dependency Security
# Scan 的 run 结论需要该权限。
permissions:
  contents: read
  actions: read
  packages: write

jobs:
  # ==================== 部署前置门禁 ====================
  # 【设计 2026-10-01，M-02 真闭合 2026-10-31 更新】本仓库历史 0 PR、直推 master，
  # GitHub required status checks 在此模式下空转，故把 CI 汇总与安全扫描结论前移
  # 到部署链路：任一不通过则镜像不推送（CI 触发 + 扫描回查）。
  # 三项校验缺一不可：
  # ① event / head_branch —— workflow_run 对 fork PR 的 pull_request 运行同样会
  #    触发，且它可访问 secrets 与写权限 token（pwn-request 风险）。只认 master 推送。
  #    CI 的 workflow_dispatch 触发 event=workflow_dispatch，同样被挡。
  # ② conclusion —— 官方载明 workflow_run 无论前序结论如何都会触发，必须自己判
  #    失败，不能靠 job 级 if 让 docker 静默 skipped。
  # ③ head_sha == GITHUB_SHA —— 官方事件表载明 workflow_run 的 GITHUB_SHA 是
  #    「默认分支的最新提交」而非被触发 run 的 head sha。这条相等校验同时保证了
  #    下方 docker 的 actions/checkout 检出的就是被 CI 验证过的那个 commit，避免
  #    两次推送之间间隔导致构建到未经验证的新提交（github.sha 在单次 run 内不可变）。
  security-gate:
    name: "部署门禁校验"
    runs-on: ubuntu-latest
    steps:
      - name: 校验 CI 结论与提交一致性
        # 【注入防护 2026-10-01】值必须经 env: 传入再以 $VAR 引用，禁止直接
        # ${{ }} 插进 run:。head_branch 可被 fork PR 的分支名影响，而 git ref
        # 仅禁止 空格 ~ ^ : ? * [ \ 与控制字符 —— 双引号/分号/管道/美元/反引号
        # 全部合法。直接插值会被 bash 在解析整行时先执行（|| 只短路求值、不短路
        # 解析），构成 pwn-request 注入；workflow_run 触发的 workflow 又默认可
        # 访问 secrets。经 env 传入则值不被二次解析。
        env:
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MASTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$WR_EVENT" != "push" ] || [ "$WR_HEAD_BRANCH" != "master" ]; then
            echo "❌ 仅接受 master 推送触发部署（当前 event=$WR_EVENT / head_branch=$WR_HEAD_BRANCH）"
            exit 1
          fi
          if [ "$WR_CONCLUSION" != "success" ]; then
            echo "❌ CI 汇总未通过（$WR_CONCLUSION），拒绝部署"
            exit 1
          fi
          if [ "$WR_HEAD_SHA" != "$MASTER_SHA" ]; then
            echo "❌ CI 提交与 master 最新提交不一致，拒绝部署"
            echo "   CI 提交:  $WR_HEAD_SHA"
            echo "   master:   $MASTER_SHA"
            exit 1
          fi
          echo "✅ CI 汇总通过，审计提交 = master: $MASTER_SHA"

      # 【M-02 真闭合】CI 通过后回查同一 SHA 的安全扫描结论。
      # 【为何要 poll 而非直接判】workflow_run 只看得到被监听 workflow 的结论，
      # 安全扫描是另一条链，其 run 可能尚未完成；未完成按 fail-closed 处理，
      # 但若「CI 先完成、安全扫描稍后」则短等待可避免误拒部署。
      # 【fail-closed】查询异常（403/网络）、超时未完成、conclusion 非 success 一律 exit 1。
      - name: 校验安全扫描结论（按 SHA 回查）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SCAN_NAME: "Dependency Security Scan"
          # AR-4：等待上限与轮询间隔由配置管理，不硬编码在逻辑里
          WAIT_SECONDS: ${{ vars.CD_SCAN_WAIT_SECONDS || 600 }}
          POLL_SECONDS: ${{ vars.CD_SCAN_POLL_SECONDS || 20 }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + WAIT_SECONDS ))
          while :; do
            # 同一 SHA 可能有多个 workflow 的 run，必须按 name 过滤（head_sha 已由 API 过滤）。
            # 【null 安全】扫描 run 尚未产生时 last 返回 null，直接 .status 会让 jq 报错
            # （Cannot index null）→ gh 非零退出 → 被下方 || 误判为 API 异常立即拒绝，
            # poll 循环失去意义。故显式判空：无 run 输出 "none||" 走「未完成」轮询路径。
            raw=$(timeout 30 gh api \
              "repos/$REPO/actions/runs?head_sha=$SHA&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"$SCAN_NAME\")]
                    | sort_by(.created_at)
                    | if length == 0 then \"none||\"
                      else (last | \"\(.status // \"\")|\(.conclusion // \"\")|\(.html_url // \"\")\")
                      end") || {
              echo "❌ 查询安全扫描 run 失败（API 异常），按 fail-closed 拒绝部署"
              exit 1
            }
            status=${raw%%|*}
            rest=${raw#*|}
            conclusion=${rest%%|*}
            url=${rest#*|}
            echo "安全扫描 status=$status conclusion=${conclusion:-<空>} $url"
            if [ "$conclusion" = "success" ]; then
              echo "✅ 安全扫描通过，允许部署"
              break
            fi
            if [ -n "$conclusion" ]; then
              echo "❌ 安全扫描未通过（$conclusion），拒绝部署"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "❌ 等待 ${WAIT_SECONDS}s 后安全扫描仍未完成（status=$status），按 fail-closed 拒绝部署"
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done

  docker:
    name: Docker Build & Push
    needs: [security-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./asset_management_backend
          # file 省略 = 默认 {context}/Dockerfile。勿写相对仓根的 file: ——该值原样透传给
          # buildx (--file 相对 GITHUB_WORKSPACE 解析)，仓根无 Dockerfile 即 build 必败。
          # 源码直证: docker/build-push-action src/context.ts `args.push('--file', inputs.file)`。
          # 修复: 审计 R-02 / BF-067 部署链，2026-10-13。
          push: true
          # source 标签: GHCR 包—仓联动。包名 asset-management-backend ≠ 仓库名
          # AssetManagementProgram, 不触发名称自动联动; 无联动则 GITHUB_TOKEN 对包
          # 的写/删可能 403。该 label 使 push 时自动建联(GitHub 官方机制之一)。
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/aquarius-cc/asset-management-backend:latest
            ghcr.io/aquarius-cc/asset-management-backend:${{ github.sha }}

      # 【批次 5 CI 补证 2026-10-30】M-38/M-40 曾因本机无 docker 降级为静态核对，
      # 镜像内 ls 实证留作 CI 补证 —— 本 step 即该补证：拉回刚推送的镜像，
      # 正向对照 /app/manage.py 在场，再断言退版文件（.graphify_* / .trae /
      # package*.json）不得进镜像。断言失败 = docker job 红 = CD 拒绝后续 prune。
      - name: 镜像卫生断言（M-38/M-40 CI 补证）
        env:
          IMG: ghcr.io/aquarius-cc/asset-management-backend:${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "$IMG"
          # --entrypoint sh：覆盖镜像入口（M-36 入口脚本会忽略参数直接起 migrate 等待链，
          # 首跑未覆盖即死于「数据库连接超时」exit 1，run 147 实证）
          # 正向对照：/app 在场且为后端工作目录（防空壳误通过）
          docker run --rm --entrypoint sh "$IMG" -c 'test -f /app/manage.py'
          # 卫生断言：grep 有命中 → then 分支 → 失败；无命中 → exit 1 → 走通过路径
          if docker run --rm --entrypoint sh "$IMG" -c 'ls -a /app | grep -E "^\.graphify_|^\.trae$|^package(-lock)?\.json$"'; then
            echo "❌ 镜像内检出退版文件（.graphify_* / .trae / package*.json）"
            exit 1
          fi
          echo "✅ 镜像卫生断言通过：/app/manage.py 在场，无 .graphify_* / .trae / package*.json"

  prune-images:
    name: Prune Old Images (keep last 5 + latest + prod current)
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - name: Remove old versions from GHCR (keep 5 most recent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_OWNER: ${{ github.repository_owner }}
          # 生产当前运行版本由部署流程写入 repo variable; 无值时仅按时间保留
          PROD_SHA: ${{ vars.PROD_IMAGE_SHA || '' }}
        run: |
          set -euo pipefail
          KEEP=5
          # GHCR 版本 API(GitHub REST): 用户包 = /users/{user}/packages/...
          # (owner 实测 type=User; 若迁移至 Org 需改 /orgs/{org}/)
          # 版本级删除: 删 version 连删其全部 tag —— 排除按 tag 成员判定,
          # latest/生产当前命中即整版豁免; sha 与 latest 同 digest 时折叠为同一版本, 同样被豁免。
          VER_URL="/users/${PKG_OWNER}/packages/container/asset-management-backend/versions"
          echo "查询 GHCR 版本: ${VER_URL}"

          CANDIDATES=$(gh api --paginate --slurp "${VER_URL}?per_page=100" \
            | PROD_SHA="${PROD_SHA}" python3 -c '
          import sys, json, os
          prod = os.environ.get("PROD_SHA", "")
          pages = json.load(sys.stdin)
          versions = [v for page in pages for v in page]
          out = []
          for v in versions:
              tags = set(t for t in (v.get("metadata", {}).get("container", {}).get("tags") or []) if t)
              if "latest" in tags:
                  continue
              if prod and prod in tags:
                  continue
              out.append((v.get("created_at", ""), str(v.get("id")), ",".join(sorted(tags))))
          out.sort(reverse=True, key=lambda x: x[0])
          for created, vid, tg in out:
              print("%s\t%s\t%s" % (created, vid, tg))
          ')

          TOTAL=$(printf '%s\n' "$CANDIDATES" | grep -c . || true)
          echo "候选版本共 ${TOTAL} 个(已排除 latest 与生产当前)"
          if [ "$TOTAL" -le "$KEEP" ]; then
            echo "✅ 数量未超限, 无需清理"
            exit 0
          fi

          # created_at 已倒序, 删除第 KEEP 个及之后的最旧版本
          mapfile -t LINES <<< "$CANDIDATES"
          FAILED=0
          for ((i=KEEP; i<TOTAL; i++)); do
            vid=$(printf '%s\n' "${LINES[$i]}" | cut -f2)
            tg=$(printf '%s\n' "${LINES[$i]}" | cut -f3)
            echo "删除过期版本: id=${vid} tags=${tg}"
            if ! gh api -X DELETE "/users/${PKG_OWNER}/packages/container/asset-management-backend/versions/${vid}"; then
              echo "⚠️ 删除版本 ${vid} 失败(可能已被删或权限不足)"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "❌ 删除失败 —— 排查包联动(包页 linked repository 是否为本仓)与 packages: write 权限"
            exit 1
          fi
          echo "✅ 清理完成, 已保留最近 ${KEEP} 个版本 + latest + 生产当前版本"

  # =============================================================================
  # 部署到预发布环境 —— 决策记录(BF-005): staging 从未落地(原为 echo 占位),
  # 在真实部署方案确定前此 job 不注册; 回滚演练延后, 见 docs/RollbackSOP.md §5
  # =============================================================================
