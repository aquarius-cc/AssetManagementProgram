name: Duplicate Code Regression Guard

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  duplicate-guard:
    name: "重复代码回归护栏"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: 运行重复代码回归护栏
        run: python scripts/check_duplicate_invariants.py

  function-length-guard:
    name: "BR-4 函数长度回归护栏"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: 运行 BR-4 函数长度护栏
        run: python scripts/check_function_length_guard.py

  fr6-composable-guard:
    name: "FR-6 Composable 规模回归护栏"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: 运行 FR-6 Composable 规模护栏
        run: python scripts/check_frontend_invariants.py
