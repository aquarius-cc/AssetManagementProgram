name: Duplicate Code Regression Guard

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  duplicate-guard:
    name: "重复代码回归护栏"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: 运行重复代码回归护栏
        run: python scripts/check_duplicate_invariants.py
