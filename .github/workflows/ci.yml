name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ==================== 后端检查 ====================
  backend-lint:
    name: "后端 - 代码规范 (ruff)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asset_management_backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff pytest
      - name: Ruff 代码规范检查
        run: ruff check .
      - name: Ruff 格式检查
        run: ruff format --check .
      # 护栏自测：4 个护栏（BR-4/BR-6/G-1~G-5/FR-6~FR-8）逐条断言先证红再证绿（BF-061
      # 假绿教训）。测试仅依赖父仓根下 scripts/ 与 pytest，走 tmp_path 夹具不触碰代码库。
      # scripts/tests/conftest.py 已把 scripts/ 加入 sys.path，故无 working-directory 依赖。
      - name: 护栏自测（先证红后证绿）
        run: python -m pytest ../scripts/tests -q
      # BR-4 函数长度护栏与 ruff 同 job：ruff format 会重排行数(210cfa7 曾使 B1 已拆分的
      # 两个函数由 38/49 反弹到 52/53 逻辑行越过 50 红线)，故批量格式化后必然复跑本护栏。
      # 脚本仅依赖标准库(ast/re/pathlib)，无需安装 Django；路径基于 __file__ 解析，与
      # working-directory 无关。台账：Rules_Fiels/BR4_function_length_ledger.md
      - name: BR-4 函数长度护栏
        run: python ../scripts/check_function_length_guard.py
      # BR-6 文件长度护栏与 BR-4 同 job 同理：ruff format 同样会重排行数，且格式
      # 化后须复跑。口径为「逻辑行」（排空行/注释/docstring），与 BR-4 共用
      # scripts/line_metrics.py 唯一实现(DR-1)。零存量债，上线即阻断，无容错。
      # 脚本仅依赖标准库(ast/pathlib)。台账：Rules_Fiels/BR6_file_length_ledger.md
      - name: BR-6 文件长度护栏
        run: python ../scripts/check_file_length_guard.py

  backend-type-check:
    name: "后端 - 类型检查 (mypy)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asset_management_backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements/dev.txt
      - name: MyPy 类型检查
        run: mypy . --strict

  backend-complexity:
    name: "后端 - 圈复杂度 (C90)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asset_management_backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: 圈复杂度检查（上限10）
        run: ruff check . --select C90 --config lint.mccabe.max-complexity=10

  backend-permission-check:
    name: "后端 - 权限码同步检查 (M-6)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asset_management_backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 权限码同步校验
        run: python scripts/generate_permission_codes.py --check

  api-schema-check:
    name: "M-3 - API Schema Diff (oasdiff)"
    runs-on: ubuntu-latest
    needs: [backend-lint]
    defaults:
      run:
        working-directory: asset_management_backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: dummy-key-for-schema-generation
      ALLOWED_HOSTS: localhost
      DB_PASSWORD: ci-dummy-not-real
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements/dev.txt
      - name: Install oasdiff
        run: |
          curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v1.29.1/oasdiff_1.29.1_linux_amd64.tar.gz" | tar -xz
          sudo mv oasdiff /usr/local/bin/
      - name: Generate schema
        run: |
          python manage.py spectacular --format openapi --file api-schema-current.json --validate
      - name: Diff against baseline
        run: oasdiff breaking api-schema-baseline.json api-schema-current.json
      - name: Warn on non-breaking drift
        # 非 breaking 漂移(新增端点/字段)不挡 CI, 仅警告提醒重导出 baseline, 防止底稿长期分叉
        run: |
          if ! oasdiff diff api-schema-baseline.json api-schema-current.json > /tmp/drift.txt 2>&1 || [ -s /tmp/drift.txt ]; then
            echo "::warning::API schema 存在非破坏性漂移, 请评估后重导出 baseline:"
            cat /tmp/drift.txt
            echo "重导出命令: python manage.py spectacular --format openapi-json --file api-schema-baseline.json --validate"
          fi

  api-doc-guard:
    name: "B4 - API 文档一致性护栏"
    runs-on: ubuntu-latest
    needs: [backend-lint]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # 先跑自检: 证明 V-1~V-4 规则本身会红。若规则恒绿,后续"全部通过"没有意义。
      - name: 护栏自检（负样本必红 + 正样本不误报）
        run: python scripts/check_api_doc_consistency.py --self-test
      - name: 运行 API 文档一致性护栏
        run: python scripts/check_api_doc_consistency.py

  api-doc-generate:
    name: "M-3 配套 - API 字段/枚举生成器同步核验"
    runs-on: ubuntu-latest
    needs: [backend-lint]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # 生成器驱动注释层 + 枚举区接管，文档与「Schema 基线/注解真值」必须一致。
      # 路径基于脚本 __file__ 解析，无需 working-directory；
      # 【BF-067】生成器经 codesource._setup_django() 导入 Django 读取模型 choices，
      # 故需先安装 base.txt（此前缺 install 导致全新 runner 无 Django → exit 2 秒败）。
      - run: pip install -r asset_management_backend/requirements/base.txt
      - name: API 字段/枚举生成器同步核验（差异即失败）
        run: python scripts/generate_api_field_reference.py --check

  backend-test:
    name: "后端 - 测试 + 覆盖率"
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-type-check, backend-complexity, api-schema-check]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: asset_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: asset_management_backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: asset_management_test
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SECRET_KEY: ci-test-generic-key-not-for-any-environment-123
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements/dev.txt
      - name: 数据库迁移检查
        run: python manage.py migrate --plan
      - name: 整体覆盖率检查（红线 80%）
        run: |
          pytest --cov=. --cov-fail-under=80 --cov-report=xml --cov-report=html -v
      - name: 核心 Service 层覆盖率专项检查（红线 90%）
        run: |
          pytest --cov=apps.assetmanagement.services --cov-fail-under=90 -v
          pytest --cov=apps.authusermanagement.services --cov-fail-under=90 -v
          pytest --cov=apps.usermanagement.services --cov-fail-under=90 -v
          pytest --cov=apps.unregisteredasset.services --cov-fail-under=90 -v
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: asset_management_backend/htmlcov/

  backend-mutation:
    name: "后端 - 变异测试"
    runs-on: ubuntu-latest
    needs: [backend-test]
    defaults:
      run:
        working-directory: asset_management_backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: asset_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: asset_management_test
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements/dev.txt
      - name: 变异测试（相对基线不回归）
        # 门禁策略 B批（2026-09-30）：相对基线不回归，基线存于 mutmut-baseline.json
        # （首基线 70.44%，BF-066 全量首跑）。官方口径 = (killed + timeout) /
        # (total - skipped) * 100。80% 绝对红线暂挂沙盒期，C批补测抬分后更新基线直至恢复绝对红线。
        # 配置全部来自 setup.cfg [mutmut]，此处刻意不传任何 CLI 参数（消除 CI/本地双口径）。
        timeout-minutes: 300
        run: mutmut run
      - name: 变异得分门禁（相对基线不回归）
        # 比率真源为 export-cicd-stats 产出的 JSON。`mutmut results` 只列非 killed
        # 且无 total 行，无法计算比率（旧写法 grep -c "killed" 恒为 0）。
        # 口径 = mutmut 官方公式 (killed + timeout) / (total - skipped) * 100，
        # 对齐 backend-testing-rules.md T7；分母剔除 skipped（skipped = 显式
        # pragma no mutate，不算有效变异）；timeout 计入杀灭（官方口径语义）。
        # 基线不得低于 mutmut-baseline.json 记录值；低于即回归，阻止合并。
        timeout-minutes: 5
        run: |
          mutmut export-cicd-stats
          python - <<'PY'
          import json
          import sys

          BASELINE_FILE = "mutmut-baseline.json"
          STATS = "mutants/mutmut-cicd-stats.json"

          try:
              with open(BASELINE_FILE, encoding="utf-8") as handle:
                  baseline = json.load(handle).get("score")
          except (FileNotFoundError, json.JSONDecodeError) as exc:
              print(f"基线文件读取失败（{exc}）：无法判分，阻止合并")
              sys.exit(1)
          if not isinstance(baseline, (int, float)):
              print("基线文件中 score 字段缺失或非数字：无法判分，阻止合并")
              sys.exit(1)

          try:
              with open(STATS, encoding="utf-8") as handle:
                  stats = json.load(handle)
          except FileNotFoundError:
              print(f"未找到 {STATS}：变异测试未真正执行，得分按 0 计")
              sys.exit(1)

          tested = stats["total"] - stats["skipped"]
          if tested <= 0:
              print(f"无有效 mutant（total={stats['total']} skipped={stats['skipped']}）")
              sys.exit(1)

          # mutmut 官方口径：timeout 视为杀灭（BLOCK_TIMEOUT 的变异体最终会挂产，等价被杀）
          score = (stats["killed"] + stats["timeout"]) / tested * 100

          # 仅用于展示的字段用 .get 兜底：旧版 mutmut 或截断文件不应让门禁抛 KeyError
          breakdown = " ".join(
              f"{key}={stats.get(key, 0)}" for key in ("killed", "survived", "timeout", "no_tests", "suspicious")
          )
          print(f"变异得分 {score:.2f}%（基线 {baseline:.2f}%，{(score - baseline):+.2f}pt）（{breakdown} tested={tested}）")
          sys.exit(0 if score >= baseline else 1)
          PY

  # ==================== 前端检查 ====================
  frontend-lint:
    name: "前端 - 代码规范 (ESLint)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue-assetmanagement
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: vue-assetmanagement/package-lock.json
      - run: npm ci
      - name: ESLint 检查
        run: npm run lint

  frontend-type-check:
    name: "前端 - 类型检查 (TypeScript)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue-assetmanagement
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: vue-assetmanagement/package-lock.json
      - run: npm ci
      - name: TypeScript 类型检查
        run: npx vue-tsc --noEmit

  frontend-complexity:
    name: "前端 - 复杂度检查 (ESLint complexity)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue-assetmanagement
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: vue-assetmanagement/package-lock.json
      - run: npm ci
      - name: 复杂度检查（上限10）
        # 临时：52 处存量欠债，0b 消解或降级为 [1, 10] 后移除本行。
        # ESLint 规则保持 error 级不动（与 frontend/AGENTS.md §1.3 措辞一致），
        # 52 条在日志中完整可见；用 step 级容错解除对 needs 链的阻断。
        # 注意：本条与 backend-complexity（ruff C90）完全独立，不得顺带放宽后端。
        continue-on-error: true
        run: >
          npx eslint . --ext .vue,.ts --rule 'complexity: [2, 10]'

  frontend-test:
    name: "前端 - 测试 + 覆盖率"
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-type-check, frontend-complexity]
    defaults:
      run:
        working-directory: vue-assetmanagement
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: vue-assetmanagement/package-lock.json
      - run: npm ci
      - name: 整体覆盖率检查（红线 80%）
        run: npx vitest run --coverage --coverage.threshold=80
      - name: 核心 Store 层覆盖率专项检查（红线 90%）
        run: npx vitest run --coverage --coverage.include="src/stores/**/*.ts" --coverage.threshold=90
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: vue-assetmanagement/coverage/

  frontend-mutation:
    name: "前端 - 变异测试"
    runs-on: ubuntu-latest
    needs: [frontend-test]
    defaults:
      run:
        working-directory: vue-assetmanagement
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: vue-assetmanagement/package-lock.json
      - run: npm ci
      - name: 变异测试（红线 80% Killed）
        # 临时：0b 移除 continue-on-error，移除条件为 score ≥ 80
        # 命令与 frontend-testing-rules.md T16 v1.6 / 前端 AGENTS v9.6.0 对齐；
        # 旧写法 `npx vitest --mutate` 的 --mutate 旗标在 Vitest 4.1.10 不存在（实跑 CACError）
        continue-on-error: true
        timeout-minutes: 90
        run: npm run test:mutate

  # ==================== 汇总 ====================
  ci-summary:
    name: "CI 汇总"
    runs-on: ubuntu-latest
    needs: [backend-test, backend-mutation, frontend-test, frontend-mutation]
    if: always()
    steps:
      - name: 检查所有 Job 结果
        run: |
          echo "=== CI Pipeline Results ==="
          echo "Backend Test: ${{ needs.backend-test.result }}"
          echo "Backend Mutation: ${{ needs.backend-mutation.result }}"
          echo "Frontend Test: ${{ needs.frontend-test.result }}"
          echo "Frontend Mutation: ${{ needs.frontend-mutation.result }}"
          if [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-test.result }}" != "success" ]; then
            echo "CI 检查未通过，阻止合并"
            exit 1
          fi
          # B批（2026-09-30）：backend-mutation 已解除 continue-on-error 并切相对基线门禁，
          # 结果纳入阻断——得分低于基线（mutmut-baseline.json）即阻止合并。
          # frontend-mutation 仍为 step 级 continue-on-error（D批 stryker 基线未取，
          # 红线 80% 未达成），故此处暂不做判定，待 D 批后再补入。
          if [ "${{ needs.backend-mutation.result }}" != "success" ]; then
            echo "后端变异门禁未通过，阻止合并"
            exit 1
          fi
